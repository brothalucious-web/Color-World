name: Build Color World
 
# Runs on every push and pull request, and can also be started by hand
# from the repository's "Actions" tab (Run workflow button).
on:
  push:
  pull_request:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
 
      # The build tool (Loom) needs Java 25 to run. The mod itself is still built for Java 21.
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
 
      # Installs Gradle itself, so the gradle/wrapper folder is not needed
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.2
 
      # Optional extra check; skipped if the tools folder was not uploaded
      - name: Run the rule tests
        if: hashFiles('tools/run-logic-tests.sh') != ''
        run: sh tools/run-logic-tests.sh
 
      - name: Build the mod
        run: gradle build
 
      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: colorworld-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
