name: Build Color World
 
# Runs on every push and pull request, and can also be started by hand
# from the repository's "Actions" tab (Run workflow button).
on:
  push:
  pull_request:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
 
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
 
      # Files uploaded through the GitHub website lose their "executable" flag
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
 
      - name: Run the rule tests
        run: sh tools/run-logic-tests.sh
 
      - name: Build the mod
        run: ./gradlew build
 
      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: colorworld-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
